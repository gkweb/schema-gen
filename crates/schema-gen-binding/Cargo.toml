[package]
name = "schema-gen-binding"
description = "NAPI-RS bindings for schema-gen"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI-RS
napi.workspace = true
napi-derive.workspace = true

# Core library
schema-gen-core = { path = "../schema-gen-core" }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# OpenAPI parsing (for transform_spec_object)
openapiv3.workspace = true

[build-dependencies]
napi-build = "2"
